name: "Demo: mise binarySource"

on:
  workflow_dispatch: {}

env:
  RENOVATE_FORK: alexanderlinne/renovate
  RENOVATE_REF: feat/39947-mise-binary-source
  MISE_VERSION: 2026.10.6

jobs:
  demo:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out Renovate from the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.RENOVATE_FORK }}
          ref: ${{ env.RENOVATE_REF }}
          path: renovate-src

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: renovate-src/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: renovate-src/package.json

      - name: Install Renovate dependencies
        working-directory: renovate-src
        run: pnpm install --frozen-lockfile

      - name: Install mise globally (binary only)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          asset="mise-v${MISE_VERSION}-linux-x64"
          url="https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/${asset}"
          echo "Downloading $url"
          curl -fsSL -o "$HOME/.local/bin/mise" "$url"
          chmod +x "$HOME/.local/bin/mise"
          installed_version="$("$HOME/.local/bin/mise" version)"
          echo "Installed mise version: $installed_version"
          case "$installed_version" in
            "$MISE_VERSION"*) ;;
            *)
              echo "::error::expected mise version $MISE_VERSION, got: $installed_version"
              exit 1
              ;;
          esac

      - name: Shadow the runner's Go
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/go-stub"
          # Unquoted heredoc: the absolute log path is baked in now, because Renovate
          # passes only a filtered environment (no RUNNER_TEMP) to child processes.
          cat > "$RUNNER_TEMP/go-stub/go" <<EOF
          #!/bin/sh
          echo "go-stub \$*" >> "$RUNNER_TEMP/go-stub-calls.log"
          echo "go-stub: the runner's Go is disabled in this demo" >&2
          exit 127
          EOF
          chmod +x "$RUNNER_TEMP/go-stub/go"
          : > "$RUNNER_TEMP/go-stub-calls.log"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/go-stub" >> "$GITHUB_PATH"

      - name: Verify PATH shadowing
        run: |
          set -euo pipefail
          echo "go resolves to: $(command -v go)"
          echo "mise resolves to: $(command -v mise)"
          test "$(command -v go)" = "$RUNNER_TEMP/go-stub/go"
          test "$(command -v mise)" = "$HOME/.local/bin/mise"

      - name: "Control run: binarySource=global (dry run)"
        working-directory: renovate-src
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_DRY_RUN: full
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: optional
          RENOVATE_GIT_AUTHOR: "Renovate mise demo <renovate-mise-demo@users.noreply.github.com>"
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"GOTOOLCHAIN":"local"}'
          LOG_LEVEL: debug
        run: node lib/renovate.ts

      - name: Print and reset Go stub log (control run)
        run: |
          set -euo pipefail
          echo "Go stub calls during the control run (expected: non-empty, proves the control run hit the runner's Go):"
          cat "$RUNNER_TEMP/go-stub-calls.log" || true
          : > "$RUNNER_TEMP/go-stub-calls.log"

      - name: "mise run: binarySource=mise (real run)"
        working-directory: renovate-src
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BINARY_SOURCE: mise
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: optional
          RENOVATE_GIT_AUTHOR: "Renovate mise demo <renovate-mise-demo@users.noreply.github.com>"
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"GOTOOLCHAIN":"local"}'
          LOG_LEVEL: debug
        run: node lib/renovate.ts

      - name: Print Go stub log (mise run) and safe-mode canary status
        if: always()
        run: |
          set -euo pipefail
          echo "Go stub calls during the mise run (expected: empty, proves mise's Go was used instead):"
          cat "$RUNNER_TEMP/go-stub-calls.log" || true
          if [ -f /tmp/mise-safe-mode-canary ]; then
            echo "::warning::safe-mode canary file exists - mise executed code from mise.toml outside safe mode"
          else
            echo "Safe-mode canary file absent, as expected."
          fi
